name: Automated PR Review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  claude-review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Run Claude review
        env:
          ANTHROPIC_MODEL: claude-sonnet-4-6
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git diff "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}" > /tmp/diff.txt
          claude --print "Review this git diff for code quality, bugs, performance, and security issues. Format your feedback as clean markdown comments referencing the files. Check API.md, AGENTS.md, README.md, and anything in /docs for reference. Formulate your review in French." < /tmp/diff.txt > /tmp/review.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/review.md

  copilot-fallback-review:
    needs: claude-review
    if: ${{ always() && needs.claude-review.result == 'failure' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install GitHub Copilot CLI
        run: npm install -g @github/copilot

      - name: Run Copilot fallback review
        env:
          GH_TOKEN: ${{ secrets.COPILOT_REVIEW_TOKEN }}
        run: |
          git diff "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}" > /tmp/diff.txt
          copilot -p "Review this git diff for code quality, bugs, performance, and security issues. Return only a concise Markdown review in French, with filenames and line references where applicable. Do not modify files or call GitHub APIs." < /tmp/diff.txt > /tmp/review.md
          test -s /tmp/review.md

      - name: Post Copilot review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/review.md
